<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07000d">

<title>ULTRA iOS INJ v1</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html{
min-height:100%;
background:#07000d;
}

body{
min-height:100vh;
min-height:100dvh;
overflow-x:hidden;
background:
radial-gradient(circle at 50% 8%,rgba(153,0,255,.17),transparent 32%),
radial-gradient(circle at 0% 70%,rgba(0,180,255,.08),transparent 30%),
#07000d;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

.bg-glow{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.glow{
position:absolute;
width:360px;
height:360px;
border-radius:50%;
filter:blur(100px);
opacity:.14;
}

.glow.one{
top:-150px;
left:-120px;
background:#9c00ff;
}

.glow.two{
right:-170px;
top:35%;
background:#00d9ff;
}

.glow.three{
bottom:-180px;
left:30%;
background:#7600ff;
}

.grid{
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
opacity:.18;
background-image:
linear-gradient(rgba(174,0,255,.12) 1px,transparent 1px),
linear-gradient(90deg,rgba(174,0,255,.12) 1px,transparent 1px);
background-size:45px 45px;
mask-image:linear-gradient(
to bottom,
transparent,
black 15%,
black 80%,
transparent
);
}

.scanline{
position:fixed;
left:0;
right:0;
top:-20%;
height:1px;
z-index:1;
pointer-events:none;
background:linear-gradient(
90deg,
transparent,
rgba(157,0,255,.8),
rgba(0,217,255,.8),
transparent
);
box-shadow:
0 0 15px rgba(157,0,255,.7),
0 0 25px rgba(0,217,255,.5);
animation:scan 7s linear infinite;
}

@keyframes scan{
from{transform:translateY(0)}
to{transform:translateY(140vh)}
}

#particles{
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
}

.container{
position:relative;
z-index:2;
width:min(92%,620px);
margin:0 auto;
padding:25px 0 55px;
}

.back{
display:inline-flex;
align-items:center;
gap:7px;
color:rgba(255,255,255,.55);
text-decoration:none;
font-size:12px;
font-weight:700;
letter-spacing:1px;
padding:9px 13px;
border:1px solid rgba(255,255,255,.07);
border-radius:12px;
background:rgba(255,255,255,.025);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
transition:.2s ease;
}

.back:active{
transform:scale(.96);
}

.hero{
text-align:center;
padding:45px 10px 30px;
}

.app-icon-large{
width:115px;
height:115px;
object-fit:cover;
border-radius:29px;
box-shadow:
0 0 25px rgba(174,0,255,.48),
0 0 70px rgba(174,0,255,.14),
0 15px 35px rgba(0,0,0,.3);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-7px)}
}

.hero h1{
margin-top:23px;
font-size:clamp(30px,8vw,48px);
line-height:1;
font-weight:900;
letter-spacing:-1.8px;
background:linear-gradient(
100deg,
#fff 10%,
#c358ff 52%,
#00d9ff 90%
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.hero-subtitle{
margin-top:11px;
color:rgba(255,255,255,.48);
font-size:11px;
font-weight:700;
letter-spacing:1.8px;
text-transform:uppercase;
}

.status{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:17px;
padding:8px 14px;
border:1px solid rgba(0,255,180,.17);
border-radius:100px;
background:rgba(0,255,180,.04);
color:rgba(190,255,235,.8);
font-size:10px;
font-weight:800;
letter-spacing:1.4px;
}

.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:#00ffad;
box-shadow:0 0 10px #00ffad;
}

.main-card{
position:relative;
overflow:hidden;
padding:20px;
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.055),
rgba(255,255,255,.015)
);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.04),
0 20px 60px rgba(0,0,0,.22);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
}

.main-card::before{
content:"";
position:absolute;
width:250px;
height:250px;
top:-180px;
left:50%;
transform:translateX(-50%);
border-radius:50%;
background:rgba(163,0,255,.18);
filter:blur(50px);
pointer-events:none;
}

.install-btn{
position:relative;
display:flex;
align-items:center;
justify-content:center;
min-height:58px;
width:100%;
overflow:hidden;
color:#fff;
text-decoration:none;
border-radius:17px;
border:1px solid rgba(199,105,255,.38);
background:
linear-gradient(
135deg,
rgba(147,0,255,.42),
rgba(0,170,255,.18)
);
box-shadow:
0 0 25px rgba(150,0,255,.16),
inset 0 1px 0 rgba(255,255,255,.12);
font-size:14px;
font-weight:850;
letter-spacing:.7px;
transition:.2s ease;
}

.install-btn::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:70%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.16),
transparent
);
transform:skewX(-20deg);
animation:shine 3.2s ease-in-out infinite;
}

@keyframes shine{
0%,35%{left:-100%}
65%,100%{left:150%}
}

.install-btn:active{
transform:scale(.975);
}

.install-icon{
margin-right:9px;
font-size:17px;
}

.download-btn{
display:flex;
align-items:center;
justify-content:center;
min-height:52px;
width:100%;
margin-top:11px;
color:rgba(255,255,255,.78);
text-decoration:none;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.025);
font-size:13px;
font-weight:750;
transition:.2s ease;
}

.download-btn:active{
transform:scale(.975);
}

.info{
margin-top:20px;
border-top:1px solid rgba(255,255,255,.055);
}

.info-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
min-height:48px;
border-bottom:1px solid rgba(255,255,255,.055);
}

.info-label{
color:rgba(255,255,255,.4);
font-size:11px;
font-weight:650;
}

.info-value{
color:rgba(255,255,255,.75);
font-size:11px;
font-weight:750;
text-align:right;
}

.footer{
padding-top:28px;
text-align:center;
color:rgba(255,255,255,.23);
font-size:9px;
font-weight:700;
letter-spacing:1.7px;
}

@media (max-width:500px){

.container{
width:min(92%,620px);
padding-top:20px;
}

.hero{
padding-top:38px;
}

.app-icon-large{
width:100px;
height:100px;
border-radius:25px;
}

.hero h1{
font-size:34px;
}

}
</style>
</head>

<body>

<div class="bg-glow">
<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>
</div>

<div class="grid"></div>
<div class="scanline"></div>
<canvas id="particles"></canvas>

<main class="container">

<a href="index.html" class="back">
‹&nbsp; BACK
</a>

<section class="hero">

<img
id="appIcon"
class="app-icon-large"
src="ultra-v1.png"
alt="ULTRA iOS INJ v1"
>

<h1 id="appTitle">
ULTRA iOS INJ v1
</h1>

<p id="appSubtitle" class="hero-subtitle">
ULTRA-iOS
</p>

<div class="status">
<span class="status-dot"></span>
READY TO INSTALL
</div>

</section>

<section class="main-card">

<a
id="installBtn"
class="install-btn"
href="#"
>
<span class="install-icon">↓</span>
DIRECT OTA INSTALL
</a>

<a
class="download-btn"
href="bgmi.ipa"
download
>
DOWNLOAD IPA PACKAGE
</a>

<div class="info">

<div class="info-row">
<span class="info-label">Version</span>
<span class="info-value">ULTRA iOS</span>
</div>

<div class="info-row">
<span class="info-label">Platform</span>
<span class="info-value">iOS / iPadOS</span>
</div>

<div class="info-row">
<span class="info-label">Package</span>
<span class="info-value">IPA</span>
</div>

<div class="info-row">
<span class="info-label">Certificate</span>
<span class="info-value">ULTRA iOS Signed</span>
</div>

</div>

</section>

<div class="footer">
ULTRA-iOS • SECURE INSTALLATION HUB
</div>

</main>

<script>

const regions={

india:{
title:"ULTRA iOS INJ v1",
subtitle:"ULTRA-iOS",
icon:"ultra-v1.png",
ota:"itms-services://?action=download-manifest&url=https://flarestore.app/i/875cd9da/manifest.plist"
},

vietnam:{
title:"ULTRA iOS INJ v2",
subtitle:"ULTRA-iOS",
icon:"ultra-v2.png",
ota:"itms-services://?action=download-manifest&url=https://flarestore.app/i/b037bc5f/manifest.plist"
},

korea:{
title:"ULTRA iOS INJ v3",
subtitle:"ULTRA-iOS",
icon:"ultra-v3.png",
ota:"itms-services://?action=download-manifest&url=https://flarestore.app/i/1e703de7/manifest.plist"
},

taiwan:{
title:"ULTRA iOS INJ v4",
subtitle:"ULTRA-iOS",
icon:"ultra-v4.png",
ota:"itms-services://?action=download-manifest&url=https://flarestore.app/i/3a0b2fdb/manifest.plist"
},

global:{
title:"ULTRA iOS INJ v5",
subtitle:"ULTRA-iOS",
icon:"ultra-v5.png",
ota:"itms-services://?action=download-manifest&url=https://flarestore.app/i/a3e99872/manifest.plist"
}

};

const params=new URLSearchParams(
window.location.search
);

const selectedRegion=
params.get("region")||"india";

const region=
regions[selectedRegion]||regions.india;

const titleEl=
document.getElementById("appTitle");

const subtitleEl=
document.getElementById("appSubtitle");

const iconEl=
document.getElementById("appIcon");

const installBtn=
document.getElementById("installBtn");

document.title=region.title;

titleEl.textContent=
region.title;

subtitleEl.textContent=
region.subtitle;

iconEl.src=
region.icon;

iconEl.alt=
region.title;

installBtn.href=
region.ota;


/* PARTICLES */

const canvas=
document.getElementById("particles");

const ctx=
canvas.getContext("2d");

let particles=[];
let width=0;
let height=0;

function resizeCanvas(){

width=
canvas.width=
window.innerWidth;

height=
canvas.height=
window.innerHeight;

}

function createParticles(){

particles=[];

const count=
Math.min(
70,
Math.max(
28,
Math.floor(window.innerWidth/6)
)
);

for(let i=0;i<count;i++){

particles.push({

x:Math.random()*width,

y:Math.random()*height,

size:
Math.random()*1.7+.4,

speed:
Math.random()*.35+.08,

drift:
(Math.random()-.5)*.25,

alpha:
Math.random()*.55+.1

});

}

}

function drawParticles(){

ctx.clearRect(
0,
0,
width,
height
);

for(const p of particles){

p.y-=p.speed;
p.x+=p.drift;

if(p.y<-10){

p.y=
height+10;

p.x=
Math.random()*width;

}

if(p.x<-10)
p.x=width+10;

if(p.x>width+10)
p.x=-10;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(190,120,255,${p.alpha})`;

ctx.shadowBlur=8;

ctx.shadowColor=
"rgba(170,0,255,.7)";

ctx.fill();

}

requestAnimationFrame(
drawParticles
);

}

resizeCanvas();
createParticles();
drawParticles();

window.addEventListener(
"resize",
()=>{
resizeCanvas();
createParticles();
}
);

</script>

</body>
</html>
