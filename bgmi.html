<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07000d">
    <title>BGMI • ULTRA-iOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            min-height: 100vh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(210,0,255,.45), transparent 40%),
                radial-gradient(circle at 0% 35%, rgba(100,0,255,.25), transparent 40%),
                radial-gradient(circle at 100% 75%, rgba(255,0,220,.2), transparent 40%),
                #050008;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* PRELOADER SCREEN */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #050008;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loader.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .spinner-box {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #d000ff;
            border-right-color: #00f0ff;
            animation: ringSpin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }
        .circle-ring-inner {
            position: absolute;
            inset: 15px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #ff00c8;
            border-left-color: #7200ff;
            animation: ringSpinReverse 1s linear infinite;
        }
        @keyframes ringSpin {
            100% { transform: rotate(360deg); }
        }
        @keyframes ringSpinReverse {
            100% { transform: rotate(-360deg); }
        }
        .loader-text {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #ff00e6, #fff, #bd43ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGlow 1.5s infinite alternate;
        }
        @keyframes textGlow {
            0% { opacity: 0.5; text-shadow: 0 0 5px rgba(220,0,255,0.2); }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(220,0,255,0.8); }
        }

        /* BACKGROUND EFFECTS */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .2;
            background-image:
                linear-gradient(rgba(190,0,255,.25) 1px, transparent 1px),
                linear-gradient(90deg, rgba(190,0,255,.25) 1px, transparent 1px);
            background-size: 45px 45px;
            animation: gridMove 8s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translateY(0) rotateX(10deg); }
            100% { transform: translateY(45px) rotateX(10deg); }
        }
        .glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: .8;
            animation: ambient 6s ease-in-out infinite alternate;
        }
        .glow.one {
            background: rgba(170,0,255,.3);
            left: -160px;
            top: -150px;
        }
        .glow.two {
            background: rgba(255,0,220,.22);
            right: -180px;
            bottom: -150px;
            animation-delay: 2s;
        }
        @keyframes ambient {
            0% { transform: translate(0,0) scale(1); filter: blur(120px); }
            50% { transform: translate(60px,30px) scale(1.15); filter: blur(90px); }
            100% { transform: translate(100px,60px) scale(1.3); filter: blur(130px); }
        }
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 6px #fff,
                0 0 15px #d000ff;
            animation: starFall linear infinite;
        }
        @keyframes starFall {
            0% { transform: translate3d(0,110vh,0) scale(.3); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate3d(60px,-10vh,0) scale(1.4); opacity: 0; }
        }
        .scanline {
            position: fixed;
            left: 0; right: 0; top: -5%;
            height: 3px; z-index: 3; pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255,0,255,.9), #fff, rgba(255,0,255,.9), transparent);
            box-shadow: 0 0 15px #ff00ff, 0 0 35px #b000ff;
            opacity: .6;
            animation: globalScan 5s cubic-bezier(.4, 0, .2, 1) infinite;
        }
        @keyframes globalScan {
            from { top: -5%; }
            to { top: 105%; }
        }

        /* PAGE STRUCTURE */
        .page {
            position: relative;
            z-index: 5;
            width: min(750px, 92%);
            margin: auto;
            padding: 30px 0 60px;
        }

        /* BACK BUTTON */
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(40, 0, 60, 0.6);
            border: 1px solid rgba(220, 0, 255, 0.4);
            color: #e0b0ff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .nav-back:hover {
            background: rgba(100, 0, 150, 0.8);
            border-color: #ff00e6;
            box-shadow: 0 0 20px rgba(220, 0, 255, 0.5);
            transform: translateX(-3px);
            color: #fff;
        }

        /* MAIN CARD */
        .card {
            position: relative;
            overflow: hidden;
            padding: 40px 30px;
            border-radius: 32px;
            border: 1px solid rgba(205,45,255,.5);
            background: linear-gradient(145deg, rgba(36,0,52,.85), rgba(8,0,14,.95));
            box-shadow: 0 0 45px rgba(170,0,255,.2), inset 0 0 35px rgba(150,0,255,.08);
            backdrop-filter: blur(25px);
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 70%; height: 2px;
            background: linear-gradient(90deg, transparent, #fff, #d000ff, transparent);
            box-shadow: 0 0 15px #d000ff;
            animation: cardBeam 4s linear infinite;
        }
        @keyframes cardBeam {
            0% { left: -100%; }
            100% { left: 150%; }
        }

        /* GAME LOGO */
        .app-logo-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
        }
        .app-logo-wrap::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 38px;
            border: 1px solid rgba(230,0,255,.5);
            box-shadow: 0 0 25px rgba(220,0,255,.45);
            animation: logoRing 2.5s ease-in-out infinite alternate;
        }
        @keyframes logoRing {
            0% { transform: scale(0.98); opacity: .5; }
            100% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 35px rgba(230,0,255,.8); }
        }
        .app-logo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 30px;
            border: 2px solid rgba(230,80,255,.8);
            box-shadow: 0 0 30px #a000ff;
        }

        /* TITLES */
        .app-title {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 950;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #ff80ff, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
        }
        .app-subtitle {
            margin-top: 6px;
            color: #cbb4d6;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* STATUS BADGE */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0 30px;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(40,255,120,.5);
            background: rgba(0,80,35,.25);
            box-shadow: 0 0 20px rgba(40,255,120,.2);
            color: #78ff9d;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #31c86b;
            box-shadow: 0 0 10px #31c86b;
            animation: statusPulse 1.2s infinite;
        }
        @keyframes statusPulse {
            50% { transform: scale(1.8); opacity: .4; }
        }

        /* BUTTONS */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 35px;
        }
        .button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 58px;
            border-radius: 18px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 900;
            overflow: hidden;
            transition: all .3s cubic-bezier(.2,.8,.2,1);
        }
        .primary {
            background: linear-gradient(90deg, #7200ff, #e000ff, #ff00cc, #8200ff);
            background-size: 300%;
            box-shadow: 0 0 25px rgba(210,0,255,.45);
            animation: buttonGradient 4s linear infinite;
        }
        .primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 35px rgba(230,0,255,.7);
        }
        @keyframes buttonGradient {
            to { background-position: 300%; }
        }
        .secondary {
            background: rgba(45, 0, 70, 0.4);
            border: 1px solid rgba(210,60,255,.45);
        }
        .secondary:hover {
            background: rgba(80, 0, 120, 0.6);
            border-color: rgba(230,100,255,.8);
            box-shadow: 0 0 20px rgba(210,60,255,.3);
            transform: translateY(-2px);
        }

        /* INFO TABLE LIST */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid rgba(220,0,255,0.2);
            padding-top: 25px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(10, 0, 20, 0.6);
            border: 1px solid rgba(200,50,255,.15);
            transition: all 0.3s ease;
        }
        .info-row:hover {
            border-color: rgba(230,80,255,.5);
            background: rgba(30, 0, 50, 0.6);
            transform: translateX(4px);
        }
        .info-key {
            color: #9d83a8;
            font-size: 13px;
            font-weight: 600;
        }
        .info-val {
            font-size: 14px;
            font-weight: 850;
            color: #fff;
        }

        /* ROCKET LAUNCH ANIMATION */
        .rocket-launch {
            position: fixed;
            left: -160px; bottom: 8%;
            width: 105px; height: 105px;
            z-index: 99999; pointer-events: none; opacity: 0;
        }
        .rocket-launch.active {
            animation: rocketFly 1.35s cubic-bezier(.2,.7,.15,1) forwards;
        }
        .rocket-body {
            position: absolute; left: 28px; top: 15px;
            width: 45px; height: 70px;
            border-radius: 50% 50% 45% 45%;
            background: linear-gradient(90deg, #b8b8c4, #fff, #8b8b99);
            border: 2px solid #fff;
            box-shadow: 0 0 10px #fff, 0 0 25px #d000ff;
            transform: rotate(-42deg);
        }
        .rocket-window {
            position: absolute; width: 19px; height: 19px;
            left: 11px; top: 12px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #72d9ff 35%, #170044 70%);
            border: 2px solid #ddd;
        }
        .rocket-flame {
            position: absolute; left: 40px; top: 72px;
            width: 20px; height: 55px; border-radius: 50%;
            background: linear-gradient(to bottom, #fff, #ffe600 20%, #ff7200 48%, #ff00c8 72%, transparent);
            filter: blur(3px); transform: rotate(-42deg);
            animation: rocketFlame .08s infinite alternate;
        }
        @keyframes rocketFlame {
            from { height: 42px; opacity: .7; }
            to { height: 70px; opacity: 1; }
        }
        @keyframes rocketFly {
            0% { left: -150px; bottom: 8%; opacity: 0; transform: scale(.55) rotate(-10deg); }
            8% { opacity: 1; }
            100% { left: 115%; bottom: 112%; opacity: 0; transform: scale(.55) rotate(-10deg); }
        }

        footer {
            text-align: center;
            margin-top: 35px;
            color: #715d78;
            font-size: 11px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- PRELOADER -->
<div id="loader">
    <div class="spinner-box">
        <div class="circle-ring"></div>
        <div class="circle-ring-inner"></div>
    </div>
    <div class="loader-text">LOADING BGMI PACKAGE...</div>
</div>

<div class="glow one"></div>
<div class="glow two"></div>
<div class="scanline"></div>
<div class="particles"></div>

<div class="rocket-launch" id="rocketLaunch">
    <div class="rocket-body">
        <div class="rocket-window"></div>
    </div>
    <div class="rocket-flame"></div>
</div>

<div class="page">
    <a href="index.html" class="nav-back">← Back to Hub</a>

    <div class="card">
        <div class="app-logo-wrap">
            <img src="bgmi-icon.png" class="app-logo" alt="BGMI">
        </div>
        
        <h1 class="app-title">BATTLEGROUNDS MOBILE</h1>
        <div class="app-subtitle">🇮🇳 INDIA EDITION • ULTRA-iOS</div>

        <div class="status-badge">
            <span class="status-dot"></span>
            ONLINE & WORKING
        </div>

        <div class="button-group">
            <a href="itms-services://?action=download-manifest&url=https://cloudsigner.me/downloads/1d3089f5-716/manifest.plist" class="button primary install-trigger">
                Direct OTA Install
            </a>
            <a href="YOUR_IPA_FILE_LINK.ipa" class="button secondary">
                Download IPA Package
            </a>
        </div>

        <div class="info-list">
            <div class="info-row">
                <span class="info-key">Version</span>
                <span class="info-val">4.5.0</span>
            </div>
            <div class="info-row">
                <span class="info-key">Platform</span>
                <span class="info-val">iOS / iPadOS</span>
            </div>
            <div class="info-row">
                <span class="info-key">Size</span>
                <span class="info-val">3.5 GB</span>
            </div>
            <div class="info-row">
                <span class="info-key">Certificate</span>
                <span class="info-val" style="color: #df4cff;">ULTRA iOS Signed</span>
            </div>
        </div>
    </div>

    <footer>
        ULTRA-iOS • FUTURE IS NOW
    </footer>
</div>

<script>
    // PRELOADER DISMISSAL
    window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        setTimeout(() => {
            loader.classList.add('fade-out');
        }, 400);
    });

    // PARTICLES GENERATOR
    const particles = document.querySelector(".particles");
    for(let i = 0; i < 40; i++){
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (5 + Math.random() * 10) + "s";
        p.style.animationDelay = (-Math.random() * 10) + "s";
        const size = 1 + Math.random() * 3;
        p.style.width = size + "px";
        p.style.height = size + "px";
        particles.appendChild(p);
    }

    // ROCKET TRIGGER
    const rocket = document.getElementById("rocketLaunch");
    document.querySelectorAll(".install-trigger").forEach(button => {
        button.addEventListener("click", function(event){
            event.preventDefault();
            const destination = this.getAttribute("href");
            rocket.classList.remove("active");
            void rocket.offsetWidth;
            rocket.classList.add("active");
            
            setTimeout(() => {
                window.location.href = destination;
            }, 1000);
        });
    });

    // 3D TILT EFFECT
    const card = document.querySelector('.card');
    card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 30;
        const rotateY = (centerX - x) / 30;
        
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });
</script>
</body>
</html>
