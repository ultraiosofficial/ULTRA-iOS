<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07000d">
    <title>BGMI • ULTRA-iOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            min-height: 100vh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(210,0,255,.35), transparent 35%),
                radial-gradient(circle at 0% 40%, rgba(100,0,255,.20), transparent 35%),
                radial-gradient(circle at 100% 80%, rgba(255,0,220,.16), transparent 35%),
                #050008;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .16;
            background-image:
                linear-gradient(rgba(190,0,255,.22) 1px, transparent 1px),
                linear-gradient(90deg, rgba(190,0,255,.22) 1px, transparent 1px);
            background-size: 45px 45px;
            animation: gridMove 10s linear infinite;
        }
        @keyframes gridMove {
            from { transform: translateY(0); }
            to { transform: translateY(45px); }
        }
        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
            animation: ambient 8s ease-in-out infinite alternate;
        }
        .glow.one {
            left: -160px;
            top: -150px;
            background: rgba(170,0,255,.22);
        }
        .glow.two {
            right: -180px;
            bottom: -150px;
            background: rgba(255,0,220,.16);
            animation-delay: 2s;
        }
        @keyframes ambient {
            from { transform: translate(0,0) scale(1); }
            to { transform: translate(80px,50px) scale(1.25); }
        }
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 6px #fff,
                0 0 15px #d000ff;
            animation: starFall linear infinite;
        }
        @keyframes starFall {
            0% {
                transform: translate3d(0,110vh,0) scale(.3);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translate3d(40px,-10vh,0) scale(1.2);
                opacity: 0;
            }
        }
        .scanline {
            position: fixed;
            left: 0;
            right: 0;
            top: -5%;
            height: 2px;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                transparent,
                #ff00ff,
                #fff,
                #ff00ff,
                transparent
            );
            box-shadow:
                0 0 12px #ff00ff,
                0 0 30px #b000ff;
            opacity: .45;
            animation: globalScan 7s linear infinite;
        }
        @keyframes globalScan {
            from { top: -5%; }
            to { top: 105%; }
        }
        .page {
            position: relative;
            z-index: 5;
            width: min(900px, 94%);
            margin: auto;
            padding: 28px 0 70px;
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 18px;
            margin-bottom: 20px;
            color: #e9b5ff;
            text-decoration: none;
            border: 1px solid rgba(210,0,255,.55);
            border-radius: 30px;
            background: rgba(70,0,90,.22);
            box-shadow: 0 0 18px rgba(190,0,255,.18);
            transition: .3s;
            font-size: 14px;
            font-weight: 700;
        }
        .back:hover,
        .back:active {
            transform: translateX(-5px);
            box-shadow: 0 0 30px rgba(220,0,255,.5);
        }
        .card {
            position: relative;
            overflow: hidden;
            padding: 42px 28px;
            border-radius: 32px;
            border: 1px solid rgba(220,0,255,.55);
            background: linear-gradient(
                145deg,
                rgba(40,0,55,.82),
                rgba(8,0,15,.95)
            );
            box-shadow:
                0 0 35px rgba(180,0,255,.18),
                inset 0 0 35px rgba(150,0,255,.07);
            backdrop-filter: blur(20px);
            animation: cardIn .9s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.96);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .card::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -100px;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #ff00ff,
                #fff,
                #ff00ff,
                transparent
            );
            box-shadow: 0 0 15px #ff00ff;
            animation: scanCard 5s linear infinite;
        }
        @keyframes scanCard {
            from { top: -100px; }
            to { top: 110%; }
        }
        .icon-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 23px;
        }
        .icon-wrap::before {
            content: "";
            position: absolute;
            inset: -12px;
            border-radius: 36px;
            border: 1px solid rgba(220,0,255,.45);
            box-shadow: 0 0 25px rgba(210,0,255,.3);
            animation: iconRing 3s ease-in-out infinite;
        }
        .icon-wrap::after {
            content: "";
            position: absolute;
            inset: -23px;
            border: 1px dashed rgba(190,0,255,.25);
            border-radius: 50%;
            animation: orbit 8s linear infinite;
        }
        @keyframes iconRing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes orbit {
            to { transform: rotate(360deg); }
        }
        .app-icon {
            width: 130px;
            height: 130px;
            display: block;
            object-fit: cover;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,.3);
            box-shadow:
                0 0 20px rgba(180,0,255,.55),
                0 0 55px rgba(180,0,255,.25);
            animation: iconFloat 4s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px) rotate(1deg); }
        }
        h1 {
            text-align: center;
            font-size: clamp(29px, 7vw, 55px);
            font-weight: 950;
            background: linear-gradient(
                90deg,
                #fff,
                #e99aff,
                #ff00ff,
                #fff
            );
            background-size: 250%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleShine 4s linear infinite;
        }
        @keyframes titleShine {
            to { background-position: 250%; }
        }
        .subtitle {
            text-align: center;
            margin-top: 9px;
            color: #c9a9d4;
            font-size: 14px;
            letter-spacing: 3px;
        }
        .status {
            width: max-content;
            margin: 21px auto 28px;
            padding: 9px 18px;
            border-radius: 30px;
            color: #cfff76;
            border: 1px solid #9dff00;
            background: rgba(100,255,0,.06);
            box-shadow: 0 0 20px rgba(150,255,0,.18);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }
        .status span {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background: #aaff00;
            box-shadow: 0 0 12px #aaff00;
            animation: statusPulse 1s infinite;
        }
        @keyframes statusPulse {
            50% {
                opacity: .3;
                transform: scale(.7);
            }
        }
        .buttons {
            display: grid;
            gap: 14px;
        }
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 63px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 900;
            overflow: hidden;
            transition: .3s;
        }
        .btn-install {
            color: #fff;
            background: linear-gradient(
                90deg,
                #7200ff,
                #e000ff,
                #ff00cc,
                #8200ff
            );
            background-size: 300%;
            box-shadow:
                0 0 25px rgba(210,0,255,.45),
                0 0 60px rgba(150,0,255,.18);
            animation: buttonGradient 4s linear infinite;
        }
        @keyframes buttonGradient {
            to { background-position: 300%; }
        }
        .btn-install::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 55%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.4),
                transparent
            );
            transform: skewX(-20deg);
            animation: buttonShine 3s infinite;
        }
        @keyframes buttonShine {
            0% { left: -100%; }
            50%, 100% { left: 150%; }
        }
        .btn-download {
            color: #ead5f2;
            border: 1px solid rgba(210,60,255,.45);
            background: rgba(75,0,100,.22);
        }
        .btn:active {
            transform: scale(.97);
        }
        .info {
            margin-top: 24px;
            padding: 12px 18px;
            border-radius: 22px;
            border: 1px solid rgba(210,0,255,.3);
            background: rgba(20,0,28,.6);
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 48px;
            border-bottom: 1px solid rgba(210,0,255,.12);
        }
        .row:last-child {
            border-bottom: none;
        }
        .row-label {
            color: #9882a1;
            font-size: 13px;
            font-weight: 600;
        }
        .row-val {
            color: #fff;
            font-size: 14px;
            font-weight: 800;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: #715d78;
            font-size: 12px;
            letter-spacing: 2px;
        }
        .ripple {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #ff00ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99990;
            transform: translate(-50%,-50%);
            animation: ripple 1s ease-out forwards;
            box-shadow: 0 0 15px #ff00ff, 0 0 35px #9c00ff;
        }
        @keyframes ripple {
            from { width: 20px; height: 20px; opacity: 1; }
            to { width: 450px; height: 450px; opacity: 0; }
        }
        @media(max-width:650px) {
            .page { width: 93%; }
            .card { padding: 28px 18px; border-radius: 26px; }
            .icon-wrap, .app-icon { width: 100px; height: 100px; }
            .btn { min-height: 55px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="glow one"></div>
<div class="glow two"></div>
<div class="scanline"></div>
<div class="particles"></div>

<div class="page">
    <a href="index.html" class="back">← Back to Hub</a>

    <main class="card">
        <div class="icon-wrap">
            <img src="bgmi-icon.png" alt="BGMI" class="app-icon">
        </div>

        <h1>BATTLEGROUNDS MOBILE</h1>
        <p class="subtitle">🇮🇳 INDIA EDITION • ULTRA-iOS</p>

        <div class="status">
            <span></span>ONLINE & WORKING
        </div>

        <div class="buttons">
            <a href="itms-services://?action=download-manifest&url=https://cloudsigner.me/downloads/349c4a02-ff1/manifest.plist" class="btn btn-install">
                Direct OTA Install
            </a>
            <a href="bgmi.ipa" class="btn btn-download" download>
                Download IPA Package
            </a>
        </div>

        <div class="info">
            <div class="row">
                <span class="row-label">Version</span>
                <span class="row-val">4.5.0</span>
            </div>
            <div class="row">
                <span class="row-label">Platform</span>
                <span class="row-val">iOS / iPadOS</span>
            </div>
            <div class="row">
                <span class="row-label">Size</span>
                <span class="row-val">3.5 GB</span>
            </div>
            <div class="row">
                <span class="row-label">Certificate</span>
                <span class="row-val">ULTRA iOS Signed</span>
            </div>
        </div>
    </main>

    <footer>
        ULTRA-iOS • FUTURE IS NOW
    </footer>
</div>

<script>
    const particles = document.querySelector(".particles");
    for(let i = 0; i < 45; i++){
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (5 + Math.random() * 12) + "s";
        p.style.animationDelay = (-Math.random() * 15) + "s";
        const size = 1 + Math.random() * 3;
        p.style.width = size + "px";
        p.style.height = size + "px";
        particles.appendChild(p);
    }

    document.addEventListener("pointerdown", function(e){
        const target = e.target.closest(".btn, .back");
        if(!target) return;
        const ripple = document.createElement("div");
        ripple.className = "ripple";
        ripple.style.left = e.clientX + "px";
        ripple.style.top = e.clientY + "px";
        document.body.appendChild(ripple);
        setTimeout(() => {
            ripple.remove();
        }, 1000);
    });
</script>
</body>
</html>
