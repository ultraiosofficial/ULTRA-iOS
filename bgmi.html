<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>ULTRA iOS INJECTOR V1 • ULTRA-iOS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#090012;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(155,0,255,.22),
            transparent 38%
        ),
        radial-gradient(
            circle at 0% 75%,
            rgba(75,0,255,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 60%,
            rgba(190,0,255,.10),
            transparent 30%
        );
    z-index:0;
}

/* CONTAINER */

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:20px 18px 45px;
}

/* BACK BUTTON */

.back{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 13px;
    margin-bottom:20px;
    color:#cdbbd7;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    transition:.2s ease;
}

.back:hover{
    color:#fff;
    border-color:rgba(190,70,255,.35);
}

.back:active{
    transform:scale(.97);
}

/* MAIN CARD */

.main-card{
    padding:22px 18px 20px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            rgba(145,0,255,.17),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(185,70,255,.28);
    box-shadow:
        0 15px 45px rgba(0,0,0,.38),
        inset 0 0 30px rgba(160,0,255,.035);
}

/* ICON */

.icon-wrap{
    width:100px;
    height:100px;
    margin:2px auto 18px;
    border-radius:25px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 0 28px rgba(145,0,255,.30),
        0 10px 25px rgba(0,0,0,.35);
}

.app-icon{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* TITLE */

.title{
    text-align:center;
}

.title h1{
    font-size:25px;
    line-height:1.15;
    font-weight:900;
    letter-spacing:-.7px;
    background:linear-gradient(
        90deg,
        #ffffff,
        #d77cff,
        #ffffff
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin-top:8px;
    color:#9e91aa;
    font-size:12px;
    font-weight:600;
}

/* STATUS */

.status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-top:14px;
    color:#9ceab7;
    font-size:11px;
    font-weight:800;
    letter-spacing:.3px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#45e878;
    box-shadow:0 0 10px rgba(69,232,120,.8);
}

/* BUTTONS */

.buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:22px;
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:48px;
    padding:13px 15px;
    border-radius:14px;
    text-decoration:none;
    color:#fff;
    font-size:13px;
    font-weight:850;
    letter-spacing:.2px;
    background:linear-gradient(
        135deg,
        #9200ff,
        #5600c9
    );
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 9px 24px rgba(105,0,255,.24),
        inset 0 1px 0 rgba(255,255,255,.12);
    transition:.2s ease;
}

.btn:hover{
    filter:brightness(1.08);
}

.btn:active{
    transform:scale(.98);
}

.btn.secondary{
    background:rgba(255,255,255,.055);
    border-color:rgba(255,255,255,.10);
    box-shadow:none;
    color:#d8ccdf;
}

/* INFORMATION */

.info-title{
    margin:23px 2px 11px;
    font-size:12px;
    font-weight:850;
    color:#cfc0d8;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.info-box{
    border-radius:17px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
}

.info-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px 15px;
    border-bottom:1px solid rgba(255,255,255,.065);
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    color:#887b92;
    font-size:11px;
    font-weight:600;
}

.info-value{
    color:#eee8f1;
    font-size:11px;
    font-weight:800;
    text-align:right;
}

/* FOOTER */

.footer{
    margin-top:20px;
    text-align:center;
    color:#675b70;
    font-size:9px;
    letter-spacing:.5px;
}

/* PARTICLES */

.particle{
    position:fixed;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#c66cff;
    opacity:.45;
    pointer-events:none;
    z-index:1;
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{
    from{
        transform:translateY(110vh);
    }

    to{
        transform:translateY(-10vh);
    }
}

@media(max-width:380px){

    .container{
        padding-left:14px;
        padding-right:14px;
    }

    .main-card{
        padding-left:15px;
        padding-right:15px;
    }

    .title h1{
        font-size:22px;
    }

    .icon-wrap{
        width:90px;
        height:90px;
    }
}
</style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">
        ← Back
    </a>


    <div class="main-card">

        <div class="icon-wrap">

            <img
                src="bgmi-icon.png"
                alt="ULTRA iOS INJECTOR V1"
                class="app-icon"
            >

        </div>


        <div class="title">

            <h1>
                ULTRA iOS INJECTOR V1
            </h1>

            <div class="subtitle">
                ULTRA-iOS
            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            ONLINE &amp; WORKING

        </div>


        <div class="buttons">

            <a
                class="btn"
                href="itms-services://?action=download-manifest&url=https://flarestore.app/i/5c73e9eb/manifest.plist"
            >
                ↓ Install on iOS
            </a>

            <a
                class="btn secondary"
                href="bgmi.ipa"
            >
                Download IPA
            </a>

        </div>


        <div class="info-title">
            Application Information
        </div>

        <div class="info-box">

            <div class="info-row">

                <span class="info-label">
                    Version
                </span>

                <span class="info-value">
                    4.6.0
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Platform
                </span>

                <span class="info-value">
                    iOS / iPadOS
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Size
                </span>

                <span class="info-value">
                    1MB
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Certificate
                </span>

                <span class="info-value">
                    ULTRA iOS Signed
                </span>

            </div>

        </div>

    </div>


    <div class="footer">
        ULTRA-iOS • iOS Installation Hub
    </div>

</div>


<script>

/* FLOATING PARTICLES ONLY
   No ripple / bubble tap animation */

for(let i = 0; i < 35; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    particle.style.animationDelay =
        (-Math.random() * 15) + "s";

    particle.style.opacity =
        (0.15 + Math.random() * 0.5);

    document.body.appendChild(particle);

}

</script>

</body>
</html>
